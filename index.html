<!doctype html>
<html lang="ko">

<style>

  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  main{width:100%;max-width:560px;padding:24px 16px 8px}
  h1{margin:0;font-size:30px;text-align:center;letter-spacing:.5px}
  h1 span{color:var(--accent)}
  .desc{margin:8px 0 20px;text-align:center;font-size:13px;color:var(--sub)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .model{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:14px;color:var(--sub)}
  select{flex:1;background:#15131c;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:15px;font-family:inherit}
  select:focus{outline:2px solid var(--accent)}
  textarea{width:100%;min-height:140px;resize:vertical;background:#15131c;color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:18px;font-family:inherit}
  textarea:focus{outline:2px solid var(--accent)}
  button,.btn{background:var(--accent);color:#1a1226;border:0;border-radius:12px;padding:12px 22px;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
  button#gen{width:100%;margin-top:12px}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.gear{padding:7px 12px;font-size:18px;line-height:1;background:#2b2639;color:var(--fg);border:1px solid var(--line);border-radius:10px}
  .btn.sec{background:#2b2639;color:var(--fg);border:1px solid var(--line)}
  button.info{padding:8px 12px;font-size:13px;white-space:nowrap;background:#2b2639;color:var(--fg);border:1px solid var(--line);border-radius:10px;font-weight:600}
  .infobox{background:#15131c;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px;line-height:1.6}
  .settings{background:#15131c;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .settings .grp{font-size:13px;color:var(--sub);margin:0 0 8px}
  .switchrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-size:15px}
  .switch{position:relative;width:46px;height:26px;display:inline-block}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:#3a344a;border-radius:26px;cursor:pointer;transition:background .2s}
  .slider::before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s}
  .switch input:checked + .slider{background:var(--accent)}
  .switch input:checked + .slider::before{transform:translateX(20px)}
  .settings select{width:100%;flex:none}
  #msg{text-align:center;margin-top:14px;font-size:15px;color:var(--sub);min-height:22px}
  #msg.err{color:var(--bad)}
  #result{display:none;margin-top:14px}
  audio{width:100%}
  #result .btn{display:block;text-align:center;margin-top:10px}
  footer{padding:18px 16px 26px;font-size:12px;color:var(--sub);text-align:center}

      showInfo();

      infoBox.style.display = 'none';
    }
  });
  const AC = window.AudioContext || window.webkitAudioContext;
  const raw = {};
  let ctx = null, failed = false;

  async function loadAll(){
    ctx = new AC();
    await Promise.all(KEYS.map(async k => {
      const r = await fetch(encodeURIComponent(k) + '.wav');
      if (!r.ok) throw new Error(k);
      const ab = await ctx.decodeAudioData(await r.arrayBuffer());
      const mono = new Float32Array(ab.length);
      for (let c = 0; c < ab.numberOfChannels; c++){
        const d = ab.getChannelData(c);
        for (let i = 0; i < d.length; i++) mono[i] += d[i] / ab.numberOfChannels;
      }
      const thr = 0.006;
      let s = 0, e = mono.length - 1;
      while (s < mono.length && Math.abs(mono[s]) < thr) s++;
      while (e > s && Math.abs(mono[e]) < thr) e--;
      raw[k] = mono.subarray(s, e + 1);
    }));
  }

  const loading = loadAll().catch(() => {
    failed = true;
    gen.disabled = true;
    msg.className = 'err';
    msg.textContent = ERR;

  const beepLoading = (async () => {
    try {
      const r = await fetch('beep.wav');
      if (!r.ok) return;
      const ab = await ctx.decodeAudioData(await r.arrayBuffer());
      const mono = new Float32Array(ab.length);
      for (let c = 0; c < ab.numberOfChannels; c++){
        const d = ab.getChannelData(c);
        for (let i = 0; i < d.length; i++) mono[i] += d[i] / ab.numberOfChannels;
      }
      let peak = 0;
      for (let i = 0; i < mono.length; i++) peak = Math.max(peak, Math.abs(mono[i]));
      if (peak > 0) for (let i = 0; i < mono.length; i++) mono[i] /= peak;
      raw.BEEP = mono;
    } catch (e) {}
  })();

  function syncModel(){
    const hasSettings = parseFloat(model.value) >= 1.3;
    gear.style.display = hasSettings ? '' : 'none';
    $('profRow').style.display = parseFloat(model.value) >= 1.4 ? '' : 'none';

  }
  model.addEventListener('change', () => {
    syncModel();
    if (infoBox.style.display !== 'none') showInfo();
  });
  gear.addEventListener('click', () => {
    settings.style.display = settings.style.display === 'none' ? 'block' : 'none';
  });
  syncModel();

  function pushSyllable(ch, q){
    const idx = ch.charCodeAt(0) - 0xAC00;
    const cho = CHO[Math.floor(idx / 588)];
    const jung = JUNG[Math.floor((idx % 588) / 28)];
    const jong = JONG[idx % 28];
    if (cho !== 'ㅇ') q.push(CHO_MAP[cho] || cho);
    q.push(...JUNG_MAP[jung]);
    if (jong) q.push(...(JONG_MAP[jong] || [jong]));
  }

  function pushText(str, q){
    for (const ch of str){
      const c = ch.charCodeAt(0);
      if (c >= 0xAC00 && c <= 0xD7A3) pushSyllable(ch, q);
      else if (/\s/.test(ch)) q.push(1);
    }
  }

  function englishKeys(word){
    let w = word.toLowerCase();
    if (w === 'i') return ['ㅏ','ㅣ'];
    if (w.length > 2 && /[^aeiouy]e$/.test(w) && /[aiouy]/.test(w.slice(0, -1))) w = w.slice(0, -1);
    const tokens = [];
    let i = 0;
    while (i < w.length){
      const two = w.substr(i, 2);
      if (PAIR[two]){
        tokens.push({k: PAIR[two], v: VOWEL_PAIR.has(two)});
        i += 2;
        continue;
      }
      const c = w[i];
      if (i > 0 && c === w[i - 1] && !'aeiou'.includes(c)){ i++; continue; }
      let keys = LETTER[c];
      const next = w[i + 1];
      if (next && 'eiy'.includes(next)){
        if (c === 'c') keys = ['ㅅ'];
        if (c === 'g') keys = ['ㅈ'];
      }
      if (keys) tokens.push({k: keys, v: 'aeiouyw'.includes(c)});
      i++;
    }
    const out = [];
    tokens.forEach((t, n) => {
      out.push(...t.k);
      const nx = tokens[n + 1];
      if (!t.v && nx && !nx.v && t.k[0] !== 'ㅇ'){
        const afterVowel = n > 0 && tokens[n - 1].v;
        const sonorant = t.k.length === 1 && SONORANT.has(t.k[0]);
        if (!(sonorant && afterVowel)) out.push('ㅡ');
      }
    });
    return out;
  }

  const PROFANITY = /씨발|시발(?!점|역)|씨팔|시팔|지랄|썅놈|썅|병신|개새끼|좆|존나|미친놈|미친년|염병|ㅅㅂ|ㅆㅂ|ㅈㄹ|ㅂㅅ/g;

  const STRONG_WORDS = ['씨발','시발','씨팔','시팔','씨빨','시빨','씨벌','시벌','ㅅ발','ㅆ발','ㅅ팔','ㅆ팔','지랄','썅놈','썅','개새끼','개세끼','개색기','좆','존나','존내','조낸','졸라','미친놈','미친년','염병','ㅅㅂ','ㅆㅂ','ㅂㅅ','ㅈㄹ'];
  const STRONG_EXCEPT = {'시발':['점','역']};

  function toSkeleton(text){
    const els = [];
    let seg = 0, gap = false, i = 0;
    for (const ch of text){
      const a = i;
      i += ch.length;
      const code = ch.codePointAt(0);
      let el = null;
      if (code >= 0xAC00 && code <= 0xD7A3){
        const idx = code - 0xAC00;
        const cho = CHO[Math.floor(idx / 588)];
        const jong = JONG[idx % 28];
        el = {c: cho === 'ㅇ' ? '' : cho, v: JUNG[Math.floor((idx % 588) / 28)], j: jong ? (JONG_MAP[jong] ? JONG_MAP[jong][0] : jong) : ''};
      } else if (/[ㄱ-ㅎ]/.test(ch)){
        el = {c: ch, v: '', j: ''};
      } else if (/[ㅏ-ㅣ]/.test(ch)){
        el = {c: '', v: ch, j: ''};
      } else if (/[cC]/.test(ch)){
        el = {c: 'ㅆ', v: 'ㅣ', j: ''};
      } else if (/[sSxX]/.test(ch)){
        el = {c: 'ㅅ', v: 'ㅣ', j: ''};
      } else if (ch === '8'){
        el = {c: 'ㅍ', v: 'ㅏ', j: 'ㄹ'};
      } else if (ch !== '\n' && /[\s\p{P}\p{S}\p{N}]/u.test(ch)){
        gap = true;
        continue;
      }
      if (!el){
        els.push(null);
        seg = 0;
        gap = false;
        continue;
      }
      const gapped = gap;
      let joined = false;
      if (gap){
        joined = seg === 1;
        if (!joined) els.push(null);
        seg = 0;
        gap = false;
      }
      el.a = a;
      el.b = i;
      el.joined = joined;
      el.gapBefore = gapped;
      el.mj = false;
      els.push(el);
      seg++;
    }
    const list = [];
    for (const el of els){
      const p = list[list.length - 1];
      if (!el){
        if (p) list.push(null);
        continue;
      }
      if (p){
        if (el.c === '' && el.v && el.v === p.v && !p.j){
          p.j = el.j;
          p.b = el.b;
          p.mj = p.mj || el.joined;
          continue;
        }
        if (el.c === p.c && el.v === p.v && el.j === p.j){
          p.b = el.b;
          p.mj = p.mj || el.joined;
          continue;
        }
      }
      list.push(el);
    }
    let skel = '';
    const offs = [];
    for (const el of list){
      offs.push(skel.length);
      skel += el ? el.c + el.v + el.j + '|' : '#|';
    }
    return {skel, offs, list};
  }

  const esc = s => s.replace(/\|/g, '\\|');
  const skelOf = w => toSkeleton(w).skel;
  const STRONG_RE = (() => {
    const parts = STRONG_WORDS.map(w => {
      const ex = STRONG_EXCEPT[w];
      return esc(skelOf(w)) + (ex ? '(?!' + ex.map(x => esc(skelOf(x))).join('|') + ')' : '');
    });
    parts.sort((x, y) => y.length - x.length);
    parts.push('[ㅂㅃ](?![ㅗㅛ])[ㅏ-ㅣ]ㅇ\\|[ㅅㅆ]ㅣㄴ\\|(?!ㄴㅕㄴ\\|)');
    return new RegExp('(?<![^|])(?:' + parts.join('|') + ')', 'g');
  })();

  function detectStrong(text){
    const {skel, offs, list} = toSkeleton(text);
    const found = [];
    for (const m of skel.matchAll(STRONG_RE)){
      const e1 = offs.indexOf(m.index);
      if (e1 < 0) continue;
      const next = offs.indexOf(m.index + m[0].length);
      const e2 = next < 0 ? list.length - 1 : next - 1;
      let spanned = false;
      for (let e = e1; e <= e2; e++){
        if (list[e].mj || (e > e1 && list[e].joined)) spanned = true;
      }
      if (spanned){
        const nx = list[e2 + 1];
        if (nx && !nx.gapBefore) continue;
      }
      found.push({index: list[e1].a, length: list[e2].b - list[e1].a});
    }
    return found;

    while (i < word.length){
      let j = i;
      while (j < word.length && word[j] === word[i]) j++;
      const c = 'aeiou'.includes(word[i]) ? '[' + word[i] + '*]' : word[i];
      out += c + (j - i > 1 ? '{' + (j - i) + ',}' : '+');
      i = j;
    }
    return out;
  }

  const EN_RE = new RegExp('^(?:' + EN_PRE + ')?(?:' + EN_BASE.map(letterPattern).join('|') + ')(?:' + EN_SUF + ')?$');

  function detectEnglish(text){
    const found = [];
    for (const m of text.matchAll(/(?<![A-Za-z0-9])[A-Za-z@$][A-Za-z@$*01345]*/g)){
      const tok = m[0].replace(/\*+$/, '');
      const norm = tok.toLowerCase().replace(/@/g, 'a').replace(/\$/g, 's').replace(/0/g, 'o').replace(/1/g, 'i').replace(/3/g, 'e').replace(/4/g, 'a').replace(/5/g, 's');
      if (EN_RE.test(norm)) found.push({index: m.index, length: tok.length});
    }
    return found;
  }

  function readNumber(raw){
    const d = raw.replace(/,/g, '');
    if (d.length > 16 || (d.length > 1 && d[0] === '0')) return [...d].map(c => DIGITS[+c]).join('');
    if (/^0+$/.test(d)) return DIGITS[0];
    const UNITS = ['', '만', '억', '조'];
    const SMALL = ['', '십', '백', '천'];
    const groups = [];
    for (let i = d.length; i > 0; i -= 4) groups.unshift(d.slice(Math.max(0, i - 4), i));
    let out = '';
    groups.forEach((g, gi) => {
      if (!parseInt(g, 10)) return;
      let s = '';
      [...g].forEach((c, ci) => {
        const n = +c;
        if (!n) return;
        const pos = g.length - 1 - ci;
        s += (n === 1 && pos > 0 ? '' : DIGITS[n]) + SMALL[pos];
      });
      const unit = UNITS[groups.length - 1 - gi];
      if (unit === '만' && s === '일') s = '';
      out += s + unit;
    });
    return out;
  }

  function findProfanity(text, ver){
    if (ver >= 1.6) return detectStrong(text).concat(detectEnglish(text)).sort((x, y) => x.index - y.index);
    if (ver >= 1.5) return detectStrong(text);
    return [...text.matchAll(PROFANITY)].map(m => ({index: m.index, length: m[0].length}));
  }

  function buildQueue(text, ver, punctOn, bleep, gather){
    if (!bleep) return buildSegment(text, ver, punctOn, gather);
    const q = [];
    let last = 0;
    for (const m of findProfanity(text, ver)){
      if (m.index < last) continue;
      q.push(...buildSegment(text.slice(last, m.index), ver, punctOn, gather));
      q.push('BEEP');
      last = m.index + m.length;
    }
    q.push(...buildSegment(text.slice(last), ver, punctOn, gather));
    return q;
  }

  function buildSegment(text, ver, punctOn, gather){
    const q = [];
    const re = gather ? /[A-Za-z]+|\d{1,3}(?:,\d{3})+|\d+|[\s\S]/gu : /[A-Za-z]+|[\s\S]/gu;
    const parts = text.match(re) || [];
    parts.forEach((p, n) => {
      if (/^[A-Za-z]+$/.test(p)){
        if (ver >= 1.2) q.push(...englishKeys(p));
        return;
      }
      const code = p.charCodeAt(0);
      if (code >= 0xAC00 && code <= 0xD7A3){
        pushSyllable(p, q);
      } else if (gather && /^\d/.test(p)){
        const decimal = n >= 2 && parts[n - 1] === '.' && /\d$/.test(parts[n - 2]);
        pushText(decimal ? [...p].filter(c => /\d/.test(c)).map(c => DIGITS[+c]).join('') : readNumber(p), q);
      } else if (ver >= 1.2 && code >= 48 && code <= 57){
        pushSyllable(DIGITS[code - 48], q);
      } else if (JUNG_MAP[p]){
        q.push(...JUNG_MAP[p]);
      } else if (KEYS.includes(p) || CHO_MAP[p] || JONG_MAP[p]){
        q.push(...(CHO_MAP[p] ? [CHO_MAP[p]] : JONG_MAP[p] || [p]));
      } else if (p === '\n'){
        q.push(2);
      } else if (/\s/.test(p)){
        q.push(1);
      } else if (ver >= 1.3){
        const mark = PUNCT_ALIAS[p] || p;
        if (PUNCT_NAME[mark]){
          if (!punctOn) return;
          const prev = n > 0 ? parts[n - 1] : '';
          const name = mark === '.' && /[0-9]$/.test(prev) ? '쩜' : PUNCT_NAME[mark];
          q.push(0.5);
          pushText(name, q);
          q.push(0.5);
        } else if (/[\p{P}\p{S}]/u.test(p)){
          q.push(0.5);
          pushText(UNKNOWN, q);
          q.push(0.5);
        }
      }
    });
    return q;
  }

  function applySpeed(q, mode){
    if (mode !== 'vslow' && mode !== 'slow') return q;
    const out = [];
    for (const it of q){
      out.push(it);
      if (typeof it === 'string' && it !== 'BEEP' && (mode === 'vslow' || CONSONANTS.has(it))) out.push(it);
    }
    return out;
  }

  function merge(q, sr){
    const parts = [];
    let total = 0;
    for (const it of q){
      if (typeof it === 'number'){
        const n = Math.round(sr * GAP_MS / 1000 * it);
        parts.push(n); total += n;
      } else if (raw[it]){
        parts.push(raw[it]); total += raw[it].length;
      }
    }
    const out = new Float32Array(total);
    let pos = 0;
    for (const p of parts){
      if (typeof p === 'number') pos += p;
      else { out.set(p, pos); pos += p.length; }
    }
    return out;
  }

  function stretch(data, rate){
    const N = 2048, Hs = N / 2, tol = 512, Ha = Hs * rate;
    const outLen = Math.floor(data.length / rate);
    const out = new Float32Array(outLen + 2 * N);
    const win = new Float32Array(N);
    for (let i = 0; i < N; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / N);
    const at = x => (x >= 0 && x < data.length ? data[x] : 0);
    const frames = Math.ceil(outLen / Hs) + 1;
    let prev = 0;
    for (let k = 0; k < frames; k++){
      let best = Math.round(k * Ha);
      if (best >= data.length) break;
      if (k > 0){
        const ref = prev + Hs;
        if (ref >= data.length) break;
        const center = best;
        let bestScore = -Infinity;
        for (let c = Math.max(0, center - tol); c <= center + tol; c += 2){
          let s = 0, e = 1e-9;
          for (let i = 0; i < N; i += 4){
            const x = at(c + i);
            s += at(ref + i) * x;
            e += x * x;
          }
          const score = s / Math.sqrt(e);
          if (score > bestScore){
            bestScore = score;
            best = c;
          }
        }
      }
      const base = k * Hs;
      for (let i = 0; i < N; i++){
        const w = k === 0 && i < Hs ? 1 : win[i];
        out[base + i] += at(best + i) * w;
      }
      prev = best;
    }
    return out.subarray(0, outLen);
  }

  function encodeWav(samples, sr){
    const buf = new ArrayBuffer(44 + samples.length * 2);
    const v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0,'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); w(8,'WAVE'); w(12,'fmt ');
    v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,sr,true); v.setUint32(28,sr * 2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
    w(36,'data'); v.setUint32(40, samples.length * 2, true);
    let o = 44;
    for (let i = 0; i < samples.length; i++, o += 2){
      const s = Math.max(-1, Math.min(1, samples[i]));
      v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }
    return new Blob([buf], {type:'audio/wav'});
  }

  let lastUrl = null;
  gen.addEventListener('click', async () => {
    if (failed) return;
    const ver = parseFloat(model.value);
    const punctOn = $('punct').checked;
    const mode = ver >= 1.3 ? speed.value : 'normal';

    const bleep = ver >= 1.4 && $('prof').checked;
    const gather = ver >= 1.6 && $('gather').checked;
    const q = applySpeed(buildQueue($('text').value, ver, punctOn, bleep, gather), mode);
    if (!q.some(i => typeof i === 'string')) return;

    gen.disabled = true;
    result.style.display = 'none';
    player.pause();
    msg.className = '';
    msg.textContent = 'rica가 음성을 합성하고 있어요.';

    await loading;
    if (failed) return;
    await beepLoading;
    if (q.includes('BEEP') && !raw.BEEP){
      msg.className = 'err';
      msg.textContent = ERR;
      gen.disabled = false;
      return;
    }
    await new Promise(r => setTimeout(r, 500));

    const sr = ctx.sampleRate;
    let samples = merge(q, sr);
    if (mode === 'fast') samples = stretch(samples, 1.5);
    if (mode === 'vfast') samples = stretch(samples, 2);

    const blob = encodeWav(samples, sr);
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = URL.createObjectURL(blob);
    player.src = lastUrl;
    dl.href = lastUrl;

    msg.textContent = '';
    result.style.display = 'block';
    gen.disabled = false;
    player.play().catch(() => {});
  });
})();
</script>
