<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>rica voice</title>
<meta name="description" content="srjs가 만든 TTS 생성 ai인 rica! 텍스트를 입력하고 무료로 tts 음성을 합성하세요!">
<style>
  :root{--bg:#14121a;--card:#1e1b27;--line:#332e42;--fg:#f0ecf8;--sub:#9d94b5;--accent:#b78cff;--bad:#ff7a8a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  main{width:100%;max-width:560px;padding:24px 16px 8px}
  h1{margin:0;font-size:30px;text-align:center;letter-spacing:.5px}
  h1 span{color:var(--accent)}
  .desc{margin:8px 0 20px;text-align:center;font-size:13px;color:var(--sub)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .model{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:14px;color:var(--sub)}
  select{flex:1;background:#15131c;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:15px;font-family:inherit}
  select:focus{outline:2px solid var(--accent)}
  textarea{width:100%;min-height:140px;resize:vertical;background:#15131c;color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:18px;font-family:inherit}
  textarea:focus{outline:2px solid var(--accent)}
  button,.btn{background:var(--accent);color:#1a1226;border:0;border-radius:12px;padding:12px 22px;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
  button#gen{width:100%;margin-top:12px}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.gear{padding:7px 12px;font-size:18px;line-height:1;background:#2b2639;color:var(--fg);border:1px solid var(--line);border-radius:10px}
  .btn.sec{background:#2b2639;color:var(--fg);border:1px solid var(--line)}
  button.info{padding:8px 12px;font-size:13px;white-space:nowrap;background:#2b2639;color:var(--fg);border:1px solid var(--line);border-radius:10px;font-weight:600}
  .infobox{background:#15131c;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px;line-height:1.6}
  .settings{background:#15131c;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .settings .grp{font-size:13px;color:var(--sub);margin:0 0 8px}
  .field{margin-bottom:14px}
  .settings input[type=range]{width:100%;accent-color:var(--accent);margin:0}
  .switchrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-size:15px}
  .switch{position:relative;width:46px;height:26px;display:inline-block}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:#3a344a;border-radius:26px;cursor:pointer;transition:background .2s}
  .slider::before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s}
  .switch input:checked + .slider{background:var(--accent)}
  .switch input:checked + .slider::before{transform:translateX(20px)}
  .settings select{width:100%;flex:none}
  #msg{text-align:center;margin-top:14px;font-size:15px;color:var(--sub);min-height:22px}
  #msg.err{color:var(--bad)}
  #result{display:none;margin-top:14px}
  audio{width:100%}
  #result .btn{display:block;text-align:center;margin-top:10px}
  footer{padding:18px 16px 26px;font-size:12px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<main>
  <h1>rica <span>voice</span></h1>
  <p class="desc">srjs가 만든 TTS 생성 ai인 rica! 텍스트를 입력하고 무료로 tts 음성을 합성하세요!</p>
  <div class="card">
    <div class="model">
      <label for="model">모델</label>
      <select id="model">
        <option value="1.8" selected>rica1.8</option>
        <option value="1.7">rica1.7</option>
        <option value="1.6">rica1.6</option>
        <option value="1.5">rica1.5</option>
        <option value="1.4">rica1.4</option>
        <option value="1.3">rica1.3</option>
        <option value="1.2">rica1.2</option>
        <option value="1.1">rica1.1</option>
        <option value="device">기기 내장 tts</option>
      </select>
      <button id="info" class="info" type="button">모델 설명</button>
      <button id="gear" class="gear" type="button" aria-label="설정">⚙</button>
    </div>
    <div id="modelInfo" class="infobox" style="display:none"></div>
    <div id="settings" class="settings" style="display:none">
      <div class="switchrow">
        <span>구두점 발음</span>
        <label class="switch"><input type="checkbox" id="punct"><span class="slider"></span></label>
      </div>
      <div class="switchrow" id="profRow" style="display:none">
        <span>욕설 삐처리</span>
        <label class="switch"><input type="checkbox" id="prof"><span class="slider"></span></label>
      </div>
      <div class="switchrow" id="numRow" style="display:none">
        <span>숫자 모아 읽기</span>
        <label class="switch"><input type="checkbox" id="gather"><span class="slider"></span></label>
      </div>
      <div class="field" id="voiceRow" style="display:none">
        <p class="grp">음성 종류</p>
        <select id="voice">
          <option value="normal" selected>일반</option>
          <option value="natural">더 자연스러움</option>
          <option value="whisper">소곤거림</option>
        </select>
      </div>
      <div class="field" id="pitchRow" style="display:none">
        <p class="grp">음성 고저 <span id="pitchVal">30%</span></p>
        <input type="range" id="pitch" min="0" max="100" step="1" value="30">
      </div>
      <div id="speedSel">
      <p class="grp">음성 속도</p>
      <select id="speed">
        <option value="vslow">매우 느림</option>
        <option value="slow">느림</option>
        <option value="normal" selected>보통</option>
        <option value="fast">빠름</option>
        <option value="vfast">매우 빠름</option>
      </select>
      </div>
      <div class="field" id="speedRange" style="display:none;margin-bottom:0">
        <p class="grp">음성 속도 <span id="speedVal">50%</span></p>
        <input type="range" id="speedPct" min="0" max="100" step="1" value="50">
      </div>
    </div>
    <textarea id="text" placeholder="텍스트를 입력하세요"></textarea>
    <button id="gen">생성</button>
    <div id="msg"></div>
    <div id="result">
      <audio id="player" controls></audio>
      <a id="dl" class="btn sec" download="rica-voice.wav">wav 다운로드</a>
    </div>
  </div>
</main>
<footer>Copyright 2026 super rice jamjam studio!</footer>

<script>
(() => {
  const KEYS = [...'ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎㅏㅓㅗㅜㅡㅣㅐㅔ'];
  const CONSONANTS = new Set(KEYS.slice(0, 14));
  const CHO  = [...'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'];
  const JUNG = [...'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ'];
  const JONG = ['', ...'ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ'];
  const CHO_MAP = {'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ'};
  const JUNG_MAP = {
    'ㅏ':['ㅏ'],'ㅐ':['ㅐ'],'ㅑ':['ㅣ','ㅏ'],'ㅒ':['ㅣ','ㅐ'],
    'ㅓ':['ㅓ'],'ㅔ':['ㅔ'],'ㅕ':['ㅣ','ㅓ'],'ㅖ':['ㅣ','ㅔ'],
    'ㅗ':['ㅗ'],'ㅘ':['ㅗ','ㅏ'],'ㅙ':['ㅗ','ㅐ'],'ㅚ':['ㅗ','ㅔ'],'ㅛ':['ㅣ','ㅗ'],
    'ㅜ':['ㅜ'],'ㅝ':['ㅜ','ㅓ'],'ㅞ':['ㅜ','ㅔ'],'ㅟ':['ㅜ','ㅣ'],'ㅠ':['ㅣ','ㅜ'],
    'ㅡ':['ㅡ'],'ㅢ':['ㅡ','ㅣ'],'ㅣ':['ㅣ']
  };
  const JONG_MAP = {
    'ㄲ':['ㄱ'],'ㄳ':['ㄱ','ㅅ'],'ㄵ':['ㄴ','ㅈ'],'ㄶ':['ㄴ','ㅎ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],
    'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅅ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅀ':['ㄹ','ㅎ'],'ㅄ':['ㅂ','ㅅ'],'ㅆ':['ㅅ']
  };
  const DIGITS = '영일이삼사오육칠팔구';
  const LETTER = {
    a:['ㅏ'],e:['ㅔ'],i:['ㅣ'],o:['ㅗ'],u:['ㅓ'],y:['ㅣ'],w:['ㅜ'],
    b:['ㅂ'],c:['ㅋ'],d:['ㄷ'],f:['ㅍ'],g:['ㄱ'],h:['ㅎ'],j:['ㅈ'],k:['ㅋ'],l:['ㄹ'],m:['ㅁ'],
    n:['ㄴ'],p:['ㅍ'],q:['ㅋ'],r:['ㄹ'],s:['ㅅ'],t:['ㅌ'],v:['ㅂ'],x:['ㅋ','ㅅ'],z:['ㅈ']
  };
  const PAIR = {
    th:['ㅅ'],sh:['ㅅ','ㅣ'],ch:['ㅊ'],ph:['ㅍ'],ck:['ㅋ'],ng:['ㅇ'],qu:['ㅋ','ㅜ'],
    wh:['ㅜ'],ee:['ㅣ'],oo:['ㅜ'],ea:['ㅣ'],ai:['ㅔ'],ay:['ㅔ','ㅣ'],oa:['ㅗ'],ou:['ㅏ','ㅜ'],
    ow:['ㅏ','ㅜ'],au:['ㅗ'],aw:['ㅗ'],ie:['ㅣ'],oy:['ㅗ','ㅣ'],oi:['ㅗ','ㅣ'],ey:['ㅔ','ㅣ']
  };
  const VOWEL_PAIR = new Set(['wh','ee','oo','ea','ai','ay','oa','ou','ow','au','aw','ie','oy','oi','ey']);
  const SONORANT = new Set(['ㄴ','ㅁ','ㄹ']);
  const PUNCT_NAME = {'.':'마침표',',':'쉼표','?':'물음표',':':'콜론',';':'세미콜론',"'":'어퍼스트로피','"':'쿼테이션'};
  const PUNCT_NAME_17 = Object.assign({}, PUNCT_NAME, {
    '!':'느낌표','&':'엔드','^':'웃음','#':'우물정자','@':'골뱅이','*':'별표','(':'괄호 열고',')':'괄호 닫고',
    '`':'악센트','~':'물결표','\\':'역슬래시','/':'슬래시','-':'대시','=':'등호','_':'밑줄','|':'세로줄','+':'더하기'
  });
  const PUNCT_ALIAS ={'’':"'",'‘':"'",'“':'"','”':'"'};
  const UNKNOWN = '알 수 없는 문자';
  const GAP_MS = 180;
  const VOWEL_KEYS = [...'ㅏㅓㅗㅜㅡㅣㅐㅔ'];
  const VOWELS = new Set(VOWEL_KEYS);
  const SPECIAL_TAG = '(+rica1.8)';
  const L_MAX = 0.03;
  const L_MIN = 0.0001;
  const HOLD_MIN = 0.012;
  const HOLD_PERIODS = 4;
  const ERR = '현재 음성 합성 모델에 오류가 발생했습니다.';

  const $ = id => document.getElementById(id);
  const msg = $('msg'), gen = $('gen'), result = $('result'), player = $('player'), dl = $('dl');
  const model = $('model'), gear = $('gear'), settings = $('settings'), speed = $('speed');
  const infoBtn = $('info'), infoBox = $('modelInfo');
  const DESC = {
    'device': '기기에 내장된 음성 엔진을 사용합니다. 음성 설정은 기기 설정에서 하실 수 있습니다.',
    '1.1': 'srjs가 만든 최초로 한국어 텍스트를 발음할 수 있는 음성 합성 모델입니다. 아직 영어, 숫자 등 기호는 발음하지 못합니다.(rica1은 rice timer 맞춤형 숫자 읽기 ai)',
    '1.2': 'rica 1.2는 처음으로 영문 및 숫자 발음을 지원합니다.',
    '1.3': 'rica 1.3은 구두점을 읽을 수 있으며, 다양한 속도로 말할 수 있습니다.',
    '1.4': '욕설을 자동으로 보고 삐처리할 수 있습니다.',
    '1.5': '보다 더 강력해진 욕설 필터를 내장하고 있습니다.',
    '1.6': 'rica 1.6은 영어 욕설도 삐처리할 수 있으며, 숫자를 모아서 읽을 수 있습니다.',
    '1.7': 'rica 1.7은 기존에 구두점 발음 설정을 꺼도 알 수 없는 기호가 나오면 "알 수 없는 문자"를 계속 발음하던 버그를 수정하였으며, 더 많은 구두점을 발음할 수 있습니다.',
    '1.8': 'rica 1.8은 음성 종류를 고를 수 있으며, 더 자연스러운 억양으로 말하거나 소곤거리는 목소리로 말할 수 있습니다.'
  };
  const showInfo = () => { infoBox.textContent = DESC[model.value] || ''; };
  infoBtn.addEventListener('click', () => {
    if (infoBox.style.display === 'none'){
      showInfo();
      infoBox.style.display = 'block';
    } else {
      infoBox.style.display = 'none';
    }
  });
  const AC = window.AudioContext || window.webkitAudioContext;
  const raw = {};
  let ctx = null, failed = false;

  const raw8 = {};
  let specialPromise = null;

  async function loadWav(url){
    const r = await fetch(url);
    if (!r.ok) throw new Error(url);
    const ab = await ctx.decodeAudioData(await r.arrayBuffer());
    const mono = new Float32Array(ab.length);
    for (let c = 0; c < ab.numberOfChannels; c++){
      const d = ab.getChannelData(c);
      for (let i = 0; i < d.length; i++) mono[i] += d[i] / ab.numberOfChannels;
    }
    const thr = 0.006;
    let s = 0, e = mono.length - 1;
    while (s < mono.length && Math.abs(mono[s]) < thr) s++;
    while (e > s && Math.abs(mono[e]) < thr) e--;
    return mono.subarray(s, e + 1);
  }

  async function loadAll(){
    ctx = new AC();
    await Promise.all(KEYS.map(async k => {
      raw[k] = await loadWav(encodeURIComponent(k) + '.wav');
    }));
  }

  function ensureSpecial(){
    if (!specialPromise){
      specialPromise = Promise.all(VOWEL_KEYS.map(async k => {
        raw8[k] = await loadWav(encodeURIComponent(k + SPECIAL_TAG) + '.wav');
      })).then(() => true, () => {
        specialPromise = null;
        return false;
      });
    }
    return specialPromise;
  }

  const loading = loadAll().catch(() => {
    failed = true;
    syncModel();
  });

  const beepLoading = (async () => {
    try {
      const r = await fetch('beep.wav');
      if (!r.ok) return;
      const ab = await ctx.decodeAudioData(await r.arrayBuffer());
      const mono = new Float32Array(ab.length);
      for (let c = 0; c < ab.numberOfChannels; c++){
        const d = ab.getChannelData(c);
        for (let i = 0; i < d.length; i++) mono[i] += d[i] / ab.numberOfChannels;
      }
      let peak = 0;
      for (let i = 0; i < mono.length; i++) peak = Math.max(peak, Math.abs(mono[i]));
      if (peak > 0) for (let i = 0; i < mono.length; i++) mono[i] /= peak;
      raw.BEEP = mono;
    } catch (e) {}
  })();

  function syncModel(){
    const hasSettings = parseFloat(model.value) >= 1.3;
    gear.style.display = hasSettings ? '' : 'none';
    $('profRow').style.display = parseFloat(model.value) >= 1.4 ? '' : 'none';
    $('numRow').style.display = parseFloat(model.value) >= 1.6 ? '' : 'none';
    const v18 = parseFloat(model.value) >= 1.8;
    const vt = $('voice').value;
    $('voiceRow').style.display = v18 ? '' : 'none';
    $('pitchRow').style.display = v18 && vt === 'natural' ? '' : 'none';
    $('speedSel').style.display = v18 ? 'none' : '';
    $('speedRange').style.display = v18 ? '' : 'none';
    if (v18 && vt !== 'normal') ensureSpecial();
    if (!hasSettings) settings.style.display = 'none';
    if (failed){
      const dev = model.value === 'device';
      gen.disabled = !dev;
      msg.className = dev ? '' : 'err';
      msg.textContent = dev ? '' : ERR;
    }
  }
  $('prof').checked = parseFloat(model.value) >= 1.7;
  model.addEventListener('change', () => {
    $('prof').checked = parseFloat(model.value) >= 1.7;
    syncModel();
    if (infoBox.style.display !== 'none') showInfo();
  });
  gear.addEventListener('click', () => {
    settings.style.display = settings.style.display === 'none' ? 'block' : 'none';
  });
  $('voice').addEventListener('change', syncModel);
  $('pitch').addEventListener('input', () => {
    $('pitchVal').textContent = $('pitch').value + '%';
  });
  $('speedPct').addEventListener('input', () => {
    $('speedVal').textContent = $('speedPct').value + '%';
  });
  syncModel();

  function pushSyllable(ch, q, mk){
    const idx = ch.charCodeAt(0) - 0xAC00;
    const cho = CHO[Math.floor(idx / 588)];
    const jung = JUNG[Math.floor((idx % 588) / 28)];
    const jong = JONG[idx % 28];
    if (mk) q.push({m: 'syl'});
    if (cho !== 'ㅇ') q.push(CHO_MAP[cho] || cho);
    q.push(...JUNG_MAP[jung]);
    if (jong) q.push(...(JONG_MAP[jong] || [jong]));
  }

  function pushText(str, q, mk){
    for (const ch of str){
      const c = ch.charCodeAt(0);
      if (c >= 0xAC00 && c <= 0xD7A3) pushSyllable(ch, q, mk);
      else if (/\s/.test(ch)) q.push(1);
    }
  }

  function englishKeys(word){
    let w = word.toLowerCase();
    if (w === 'i') return ['ㅏ','ㅣ'];
    if (w.length > 2 && /[^aeiouy]e$/.test(w) && /[aiouy]/.test(w.slice(0, -1))) w = w.slice(0, -1);
    const tokens = [];
    let i = 0;
    while (i < w.length){
      const two = w.substr(i, 2);
      if (PAIR[two]){
        tokens.push({k: PAIR[two], v: VOWEL_PAIR.has(two)});
        i += 2;
        continue;
      }
      const c = w[i];
      if (i > 0 && c === w[i - 1] && !'aeiou'.includes(c)){ i++; continue; }
      let keys = LETTER[c];
      const next = w[i + 1];
      if (next && 'eiy'.includes(next)){
        if (c === 'c') keys = ['ㅅ'];
        if (c === 'g') keys = ['ㅈ'];
      }
      if (keys) tokens.push({k: keys, v: 'aeiouyw'.includes(c)});
      i++;
    }
    const out = [];
    tokens.forEach((t, n) => {
      out.push(...t.k);
      const nx = tokens[n + 1];
      if (!t.v && nx && !nx.v && t.k[0] !== 'ㅇ'){
        const afterVowel = n > 0 && tokens[n - 1].v;
        const sonorant = t.k.length === 1 && SONORANT.has(t.k[0]);
        if (!(sonorant && afterVowel)) out.push('ㅡ');
      }
    });
    return out;
  }

  const PROFANITY = /씨발|시발(?!점|역)|씨팔|시팔|지랄|썅놈|썅|병신|개새끼|좆|존나|미친놈|미친년|염병|ㅅㅂ|ㅆㅂ|ㅈㄹ|ㅂㅅ/g;

  const STRONG_WORDS = ['씨발','시발','씨팔','시팔','씨빨','시빨','씨벌','시벌','ㅅ발','ㅆ발','ㅅ팔','ㅆ팔','지랄','썅놈','썅','개새끼','개세끼','개색기','좆','존나','존내','조낸','졸라','미친놈','미친년','염병','ㅅㅂ','ㅆㅂ','ㅂㅅ','ㅈㄹ'];
  const STRONG_EXCEPT = {'시발':['점','역']};

  function toSkeleton(text){
    const els = [];
    let seg = 0, gap = false, i = 0;
    for (const ch of text){
      const a = i;
      i += ch.length;
      const code = ch.codePointAt(0);
      let el = null;
      if (code >= 0xAC00 && code <= 0xD7A3){
        const idx = code - 0xAC00;

      if (k > 0){
        const ref = prev + Hs;
        if (ref >= data.length) break;
        const center = best;
        let bestScore = -Infinity;
        for (let c = Math.max(0, center - tol); c <= center + tol; c += 2){

      for (let i = 0; i < N; i++){

    const level = Math.min(1, Math.max(0, (parseFloat($('pitch').value) || 0) / 100));
    let samples = natural ? mergeNatural(q, sr, level) : merge(q, sr, voice === 'whisper');
    if (ver >= 1.8){
      if (rate > 1.001) samples = stretch(samples, rate);
    } else {
      if (mode === 'fast') samples = stretch(samples, 1.5);
      if (mode === 'vfast') samples = stretch(samples, 2);
    }

    const blob = encodeWav(samples, sr);
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = URL.createObjectURL(blob);
    player.src = lastUrl;
    dl.href = lastUrl;

    msg.textContent = '';
    result.style.display = 'block';
    gen.disabled = false;
    player.play().catch(() => {});
  });
})();
</script>
